<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مصروفات المواقع</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* VOICE: a site office clipboard — practical, calm, fast on a phone in the sun.
   IDEA: the receipt slip; every invoice is a slip with a stamped status.
   PICTURE: the working tool itself (camera button, review slips), no decoration.
   COLOUR and TYPE: concrete white ground, deep ink #16202e, safety orange #e8590c accent; IBM Plex Sans Arabic.
   LAYOUT: top bar + tabs, one column on phones, list/detail on desktop. */
:root{color-scheme:light dark;
  --bg:light-dark(#f4f3ef,#11161d);--card:light-dark(#ffffff,#19212b);--ink:light-dark(#16202e,#e9edf2);
  --mute:light-dark(#5d6672,#9aa6b3);--line:light-dark(#e2dfd6,#2a3541);--acc:#e8590c;--acc-ink:#fff;
  --ok:light-dark(#1d7a46,#4cc38a);--warn:light-dark(#a15c00,#f0b35a);--bad:light-dark(#b42318,#f08a80);
  --chip:light-dark(#f0eee8,#222c37)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "IBM Plex Sans Arabic",system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{line-height:1.2;margin:0 0 .5em;text-wrap:balance}h1{font-size:28px}h2{font-size:22px}h3{font-size:17px}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{width:100%;min-height:44px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);font-size:16px}
textarea{min-height:70px}
label{display:block;font-size:14px;color:var(--mute);margin:12px 0 4px}
:focus-visible{outline:3px solid color-mix(in srgb,var(--acc) 60%,transparent);outline-offset:2px}
.btn{min-height:44px;padding:10px 18px;border-radius:10px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-weight:500}
.btn.primary{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.btn.good{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.bad{color:var(--bad);border-color:currentColor}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{min-height:36px;padding:6px 12px;font-size:14px}
.top{display:flex;align-items:center;gap:12px;padding:12px max(4vw,16px);background:#16202e;color:#fff;flex-wrap:wrap}
.top b{font-size:18px}.top .who{margin-inline-start:auto;font-size:14px;opacity:.85}
.top .btn{background:transparent;color:#fff;border-color:#ffffff40}
.tabs{display:flex;gap:4px;padding:0 max(4vw,16px);background:#16202e;overflow-x:auto}
.tabs button{background:none;border:0;color:#ffffffb0;padding:12px 14px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap;font-size:15px}
.tabs button[aria-selected=true]{color:#fff;border-color:var(--acc)}
main{max-width:1240px;margin:0 auto;padding:24px max(4vw,16px) 64px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}
.grid{display:grid;gap:16px}.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));margin-bottom:16px}
.kpi .n{font-size:clamp(24px,4vw,32px);font-weight:700;font-variant-numeric:tabular-nums}.kpi .l{color:var(--mute);font-size:14px}
.chip{display:inline-block;padding:2px 10px;border-radius:99px;font-size:13px;background:var(--chip);white-space:nowrap}
.st-auto_ok,.st-approved{color:var(--ok)}.st-needs_review,.st-submitted{color:var(--warn)}.st-rejected{color:var(--bad)}.st-settled{color:var(--mute)}
.flag{background:color-mix(in srgb,var(--warn) 15%,transparent);color:var(--warn);margin:2px}
.flag.hard{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
table{width:100%;border-collapse:collapse;font-size:15px}th,td{text-align:start;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:500;color:var(--mute);font-size:13px}td.num,th.num{text-align:left;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.click{cursor:pointer}tr.click:hover{background:color-mix(in srgb,var(--acc) 6%,transparent)}
.scroll{overflow-x:auto}
.shoot{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:220px;border:2px dashed var(--line);border-radius:14px;cursor:pointer;text-align:center;padding:20px;background:var(--card)}
.shoot .big{width:84px;height:84px;border-radius:50%;background:var(--acc);display:grid;place-items:center}
.shoot img{max-height:320px;max-width:100%;border-radius:10px}
.slip{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--card);display:grid;gap:6px}
.slip .amt{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.sp{flex:1}
.mute{color:var(--mute);font-size:14px}.err{color:var(--bad)}.okt{color:var(--ok)}
.detail{display:grid;gap:16px;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.detail img{width:100%;border-radius:10px;border:1px solid var(--line);background:#0001}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.toast{position:fixed;inset-inline:16px;bottom:16px;margin:auto;max-width:480px;background:#16202e;color:#fff;padding:12px 16px;border-radius:10px;z-index:9;opacity:0;transform:translateY(10px);transition:.2s;pointer-events:none}
.toast.on{opacity:1;transform:none}
.login{max-width:420px;margin:8vh auto}
.hide{display:none!important}
@media(prefers-reduced-motion:reduce){.toast{transition:none}}
@media(max-width:760px){.detail{grid-template-columns:1fr}}
@media(max-width:600px){table{font-size:13px}.stack thead{display:none}.stack tr{display:grid;padding-block:10px;border-bottom:1px solid var(--line)}.stack td{display:flow-root;border:0;padding:3px 0;padding-inline-start:7.5em;text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:7em;margin-inline-start:-7.5em;color:var(--mute);font-size:12px}.stack td:empty{display:none}.f2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app">
  <section id="login" class="login card hide">
    <h1>مصروفات المواقع</h1>
    <p class="mute">سجّل فواتير المشتريات من الموقع في ثواني.</p>
    <form id="loginForm">
      <label for="email">الإيميل</label><input id="email" type="email" autocomplete="email" required dir="ltr">
      <label for="password">كلمة المرور</label><input id="password" type="password" autocomplete="current-password" required dir="ltr">
      <div id="setupExtra" class="hide">
        <label for="fullName">اسمك</label><input id="fullName" autocomplete="name">
        <label for="setupCode">كود التشغيل الأول</label><input id="setupCode" dir="ltr" autocomplete="off">
      </div>
      <p id="loginMsg" class="mute"></p>
      <div class="row"><button class="btn primary" id="loginBtn" type="submit">دخول</button><span class="sp"></span>
      <button class="btn sm" type="button" id="toggleSetup">أول تشغيل؟</button></div>
      <p class="mute">الحسابات بيعملها الأدمن من صفحة الإعدادات.</p>
    </form>
  </section>
  <div id="shell" class="hide">
    <header class="top"><b>مصروفات المواقع</b><span class="who" id="who"></span><button class="btn sm" id="logout">خروج</button></header>
    <nav class="tabs" id="tabs" role="tablist"></nav>
    <main id="view"></main>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
<script src="app.js"></script>
</body>
</html>
